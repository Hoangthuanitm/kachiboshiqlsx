<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a44a8">
<title>Sổ Kiểm Tra Kachiboshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
/* Layout: sổ tay kiểm tra ca — thanh tab dính trên cùng, một cột trên điện thoại; dashboard lưới 2 cột trên màn rộng. Mực xanh bút bi như phiếu giấy. */
:root{
  --bg:#eef1f0; --paper:#ffffff; --ink:#1b2430; --muted:#5d6a72; --line:#d3dad8;
  --pen:#2a44a8; --pen-soft:#e4e9f8; --on-pen:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --ng:#c0322b; --ng-soft:#fbe3e1; --warn:#a86400; --warn-soft:#fbefd9; --idle:#8a969c; --idle-soft:#eceff0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --paper:#1a2128; --ink:#e6ebee; --muted:#9aa7ae; --line:#2e3942;
  --pen:#8fa6ff; --pen-soft:#232d4d; --on-pen:#10152a;
  --ok:#5fcf93; --ok-soft:#173326; --ng:#ff7f77; --ng-soft:#3a1c1b; --warn:#f0b04a; --warn-soft:#3a2c13; --idle:#7d8a91; --idle-soft:#222a31;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --paper:#1a2128; --ink:#e6ebee; --muted:#9aa7ae; --line:#2e3942;
  --pen:#8fa6ff; --pen-soft:#232d4d; --on-pen:#10152a;
  --ok:#5fcf93; --ok-soft:#173326; --ng:#ff7f77; --ng-soft:#3a1c1b; --warn:#f0b04a; --warn-soft:#3a2c13; --idle:#7d8a91; --idle-soft:#222a31;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
:lang(ja) body, body.ja{line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px 6px}
.brand h1{font-family:var(--f-display);font-size:26px;letter-spacing:.02em;margin:0;line-height:1.1;text-transform:uppercase}
body.ja .brand h1{font-family:var(--f-body);font-size:20px;font-weight:700}
.brand .jp{color:var(--muted);font-size:12px}
.brand .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:5px 10px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mebtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.role{font-size:11px;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.cam:focus-within{outline:2px solid var(--pen);outline-offset:2px}
.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.banner.info{background:var(--pen-soft);color:var(--pen)}
section.view{padding-top:18px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.2;text-wrap:balance}
body.ja h2{font-family:var(--f-body);font-size:20px;font-weight:700}
h3{font-size:15px;margin:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.sub{color:var(--muted);font-size:13px}
.jp-s{color:var(--muted);font-size:12px;display:block}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.formcard{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px}
.formcard b{font-size:16px}
.formcard[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.row{display:flex;flex-wrap:wrap;gap:14px}
.row>.field{flex:1 1 180px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:500 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen);color:var(--on-pen)}
.chip.sm{min-height:32px;padding:4px 10px;font-size:13px}
input[type=date],input[type=time],input[type=month],input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{min-height:84px;resize:vertical}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .txt{flex:1 1 200px;min-width:0}
.seg{display:flex;gap:6px}
.seg button,.pt{min-width:64px;min-height:44px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 15px var(--f-data);border-radius:8px;cursor:pointer}
.seg button.on-OK,.pt.on-OK{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on-NG,.pt.on-NG{background:var(--ng);border-color:var(--ng);color:#fff}
.pts{display:grid;grid-template-columns:repeat(3,minmax(58px,1fr));gap:6px}
.pts .h{font-size:11px;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font:600 14px var(--f-body);padding:9px 16px;border-radius:8px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen);font-size:16px;padding:12px 22px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 12px}
.stepper span{flex:1;font-size:14px}
.stepper button{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:700 18px var(--f-data);cursor:pointer}
.stepper output{min-width:28px;text-align:center;font:600 16px var(--f-data)}
.defects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.stepper span{min-width:0;overflow-wrap:anywhere}
.measure{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.measure .big{font:600 28px var(--f-data);padding:10px 12px;min-height:56px}
.range{font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px var(--f-body);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-ng{background:var(--ng-soft);color:var(--ng)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-idle{background:var(--idle-soft);color:var(--idle)} .p-pen{background:var(--pen-soft);color:var(--pen)}
.ngbox{border:1.5px solid var(--ng);background:var(--ng-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ngbox strong{color:var(--ng)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
.savebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.result{font:700 20px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.msg{font-size:14px}
.msg.err{color:var(--ng)} .msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgb(0 0 0 / .2);max-width:calc(100% - 32px);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font:600 26px var(--f-data);font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat .delta{font-size:12px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .delta .sub{font-weight:400}
.stat.ng b{color:var(--ng)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.board{display:flex;flex-direction:column;gap:14px}
.bgroup h3{font-size:15px;margin-bottom:6px}
.brow{display:grid;grid-template-columns:minmax(90px,1.1fr) 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.brow .name{font-weight:600;display:flex;flex-direction:column;justify-content:center;min-width:0}
.brow .name small{font-weight:400;color:var(--muted);font-size:12px}
.slot{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.slot small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.ng{border-color:var(--ng)} .slot.late{border-color:var(--warn)}
.slot:disabled{cursor:default;opacity:.8}
.bhead{display:grid;grid-template-columns:minmax(90px,1.1fr) 1fr 1fr;gap:8px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
td.wrapc{white-space:normal;min-width:180px}
td.num,th.num{text-align:right}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
td.mono{font-family:var(--f-data)}
tr.ngrow td{background:var(--ng-soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .lab small{color:var(--muted)}
.hbar .track{height:14px;background:var(--idle-soft);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--pen)}
.hbar .fill.ng{background:var(--ng)}
.hbar .val{font:600 13px var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart svg{display:block;width:100%;height:auto}
.chartwrap{overflow-x:auto}
.chartwrap svg{min-width:460px}
.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
.heat th,.heat td{padding:0;border:0;background:none;white-space:nowrap}
.heat th{font-weight:600;color:var(--muted);text-align:center;padding:2px;text-transform:none;letter-spacing:0}
.heat th.rowh{text-align:left;padding-right:8px;font-size:12px;color:var(--ink);position:sticky;left:0;background:var(--paper)}
.hc{display:flex;flex-direction:column;gap:1px;width:18px}
.hc i{display:block;height:9px;border-radius:2px;background:var(--idle-soft)}
.hc i.ok{background:var(--ok)} .hc i.ng{background:var(--ng)} .hc i.miss{background:var(--warn)} .hc i.late{background:var(--ok);outline:2px solid var(--warn);outline-offset:-2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;border-radius:2px;display:inline-block}
.approve{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.src{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--warn-soft);border-radius:8px;color:var(--warn);font-size:14px}
/* Ảnh */
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.cam{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--pen);color:var(--pen);border-radius:8px;padding:8px 12px;cursor:pointer;font:600 13px var(--f-body);min-height:44px;background:var(--paper)}
label.cam.req{border-style:solid;background:var(--pen-soft)}
label.cam svg{width:18px;height:18px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--idle-soft);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;font:700 13px var(--f-body);cursor:pointer;line-height:22px;padding:0}
.thumb small{position:absolute;left:0;right:0;bottom:0;background:rgb(0 0 0 / .55);color:#fff;font:10px var(--f-data);text-align:center}
.minithumbs{display:flex;gap:4px}
.minithumbs button{width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--idle-soft);cursor:pointer}
.minithumbs img{width:100%;height:100%;object-fit:cover;display:block}
.photo-need{font-size:12px;color:var(--pen);font-weight:600}
/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgb(10 14 20 / .72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--paper);color:var(--ink);border-radius:var(--r);max-width:min(900px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%}
.modal .box.narrow{max-width:420px}
.modal img.full{width:100%;height:auto;border-radius:6px;background:#000}
.modal .gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.modal figure{margin:0;display:flex;flex-direction:column;gap:4px}
.modal figcaption{font-size:12px;color:var(--muted)}
/* Đăng nhập */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
.login .box{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.login h1{font-family:var(--f-display);font-size:30px;text-transform:uppercase;margin:0;line-height:1.1}
body.ja .login h1{font-family:var(--f-body);font-size:24px}
.linkbtn{background:none;border:0;color:var(--pen);font:600 13px var(--f-body);cursor:pointer;padding:0;text-align:left;text-decoration:underline}
.code{font:12px/1.5 var(--f-data);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;max-height:280px;margin:0}
details summary{cursor:pointer;font-weight:600}
.ulist .u{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.ulist .u .who b{display:block}
.ulist .u .who small{color:var(--muted)}
.asg{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,3fr);gap:10px;padding-block:12px;border-bottom:1px solid var(--line);align-items:start}
@media (max-width:560px){.asg{grid-template-columns:1fr}.ulist .u{grid-template-columns:1fr auto}.ulist .u .rolecell{grid-column:1/-1}}
/* Chọn ngày */
.dpick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font:16px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px;cursor:pointer;text-align:left}
.dpick svg{color:var(--muted);flex:0 0 auto}
.tfield{font-family:var(--f-data)!important;letter-spacing:.04em}
#dp{position:fixed;z-index:25;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0 / .18);padding:12px;width:300px;max-width:calc(100vw - 24px)}
#dp .dph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
#dp .dph button{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font-size:18px}
#dp .dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
#dp .dpg.m{grid-template-columns:repeat(3,1fr)}
#dp .dpg span{font-size:11px;color:var(--muted);font-weight:600;padding-block:4px}
#dp .dpg button{border:1px solid transparent;background:none;color:var(--ink);border-radius:8px;min-height:36px;cursor:pointer;font:500 14px var(--f-body)}
#dp .dpg button:hover{background:var(--pen-soft)}
#dp .dpg button.today{border-color:var(--pen)}
#dp .dpg button.sel{background:var(--pen);color:var(--on-pen)}
#dp .dpg button.off{color:var(--muted)}
#dp .dpf{display:flex;justify-content:space-between;margin-top:8px}
/* Tooltip & tương tác dashboard */
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px/1.4 var(--f-body);padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgb(0 0 0 / .2);white-space:pre-line}
button.hbar{width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:3px 4px;border-radius:6px}
button.hbar:hover{background:var(--pen-soft)}
button.hbar[aria-pressed="true"]{background:var(--pen-soft);outline:1.5px solid var(--pen)}
.hbars.dim button.hbar:not([aria-pressed="true"]){opacity:.45}
svg .hit{cursor:pointer}
svg .hit:hover rect.bar{opacity:.8}
svg .hit.sel rect.bar{stroke:var(--ink);stroke-width:1.5}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--pen-soft);color:var(--pen);font-weight:600}
.drill tr{cursor:pointer}
.drill tr:hover td{background:var(--pen-soft)}
.hcbtn{border:0;background:none;padding:0;cursor:pointer}
.quick{display:flex;gap:6px;flex-wrap:wrap}

/* ===== Giao diện công nhân: chữ to, nút to, ít chữ ===== */
body.wkmode{font-size:18px}
.wk{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.wk-top{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.wk-ava{width:48px;height:48px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;font:700 20px var(--f-body);flex:0 0 auto}
.wk-who{flex:1;min-width:0}
.wk-who b{display:block;font-size:20px;line-height:1.2}
.wk-who span{color:var(--muted);font-size:15px}
.wk-out{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;min-height:48px;padding:0 14px;font:600 16px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.wk-h{font:700 26px/1.2 var(--f-body);margin:18px 0 4px}
.wk-sub{color:var(--muted);font-size:16px;margin:0 0 14px}
.wk-list{display:flex;flex-direction:column;gap:12px}
.wk-task{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:18px;padding:14px;cursor:pointer;font:inherit;min-height:96px}
.wk-task .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--pen-soft);color:var(--pen)}
.wk-task .ic svg{width:38px;height:38px}
.wk-task .nm{font-size:21px;font-weight:700;line-height:1.2}
.wk-task .ca{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:16px;margin-top:2px}
.wk-task .ca svg{width:20px;height:20px}
.wk-task .st{font-weight:700;font-size:15px;margin-top:6px}
.wk-task .go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pen);color:var(--on-pen)}
.wk-task .go svg{width:24px;height:24px}
.wk-task.todo{border-color:var(--pen)}
.wk-task.todo .st{color:var(--pen)}
.wk-task.late{border-color:var(--warn);background:var(--warn-soft)}
.wk-task.late .ic{background:var(--paper);color:var(--warn)} .wk-task.late .st{color:var(--warn)} .wk-task.late .go{background:var(--warn);color:#fff}
.wk-task.ok{background:var(--ok-soft);border-color:transparent}
.wk-task.ok .ic{background:var(--paper);color:var(--ok)} .wk-task.ok .st{color:var(--ok)} .wk-task.ok .go{background:var(--ok);color:#fff}
.wk-task.ng{background:var(--ng-soft);border-color:transparent}
.wk-task.ng .ic{background:var(--paper);color:var(--ng)} .wk-task.ng .st{color:var(--ng)} .wk-task.ng .go{background:var(--ng);color:#fff}
.wk-task.after{opacity:.8}
.wk-task.after .go{background:var(--idle);color:#fff}
.wk-grp{font-size:15px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.wk-empty{padding:28px 18px;text-align:center;border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-size:18px}
/* Bước kiểm */
.wz-bar{display:flex;align-items:center;gap:10px;padding-block:12px}
.wz-ib{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.wz-ib svg{width:26px;height:26px}
.wz-prog{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.wz-prog small{color:var(--muted);font-size:14px;font-weight:600}
.wz-dots{display:flex;gap:4px}
.wz-dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wz-dots i.done{background:var(--pen)} .wz-dots i.cur{background:var(--pen);opacity:.45}
.wz-ctx{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px;margin-bottom:14px}
.wz-ctx svg{width:26px;height:26px;color:var(--pen);flex:0 0 auto}
.wz-ctx b{font-size:17px}
.wz-q{font:700 27px/1.25 var(--f-body);margin:6px 0 6px;text-wrap:balance}
.wz-hint{color:var(--muted);font-size:17px;margin:0 0 16px}
.wz-yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:10px}
.wz-big{border:2.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 24px var(--f-body);cursor:pointer;padding:12px}
.wz-big svg{width:52px;height:52px}
.wz-big.pass{color:var(--ok);border-color:var(--ok)} .wz-big.fail{color:var(--ng);border-color:var(--ng)}
.wz-big.pass.on{background:var(--ok);color:#fff} .wz-big.fail.on{background:var(--ng);color:#fff}
.wz-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wz-tile{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;min-height:76px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:center;gap:2px}
.wz-tile b{font:700 21px var(--f-data);letter-spacing:.01em}
.wz-tile span{font-size:14px;color:var(--muted)}
.wz-tile.on{border-color:var(--pen);background:var(--pen-soft)}
.wz-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wz-pt{border:2.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;min-height:84px;font:700 20px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wz-pt svg{width:28px;height:28px}
.wz-pt.ok{border-color:var(--ok);color:var(--ok)} .wz-pt.ng{border-color:var(--ng);background:var(--ng);color:#fff}
.wz-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.wz-lbl{font-weight:700;font-size:18px;margin-bottom:8px;display:block}
.wz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.wz-chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;min-height:52px;padding:6px 18px;font:600 17px var(--f-body);cursor:pointer}
.wz-chip.on{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
.wz-in{width:100%;font:18px var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.wz-cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:72px;border:2.5px dashed var(--pen);border-radius:16px;color:var(--pen);background:var(--pen-soft);font:700 20px var(--f-body);cursor:pointer}
.wz-cam svg{width:32px;height:32px}
.wz-cam.done{border-style:solid;background:var(--paper)}
.wz-shot{display:flex;gap:12px;align-items:center}
.wz-shot img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.wz-need{color:var(--muted);font-weight:600;font-size:16px;margin-top:10px;display:flex;align-items:center;gap:6px}
.wz-need::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.wz-need.err{color:var(--ng)}
.wz-next{width:100%;min-height:72px;border:0;border-radius:18px;background:var(--pen);color:var(--on-pen);font:700 24px var(--f-body);cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.wz-next svg{width:28px;height:28px}
.wz-next:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.wz-next.save{background:var(--ok);color:#fff}
.wz-ghost{width:100%;min-height:64px;border:2px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);font:700 20px var(--f-body);cursor:pointer;margin-top:10px}
/* Bàn phím số */
.kp-disp{display:flex;align-items:baseline;justify-content:center;gap:8px;border:2.5px solid var(--line);border-radius:18px;padding:8px 16px;min-height:80px;margin-bottom:8px;background:var(--paper)}
.kp-disp b{font:600 56px/1 var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.kp-disp span{font-size:22px;color:var(--muted)}
.kp-disp.out{border-color:var(--ng)} .kp-disp.in{border-color:var(--ok)}
.kp-state{text-align:center;font-weight:700;font-size:18px;min-height:28px;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:58px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);font:600 30px var(--f-data);cursor:pointer}
.kp button.fn{font:700 18px var(--f-body);background:var(--bg)}
/* Lỗi */
.df-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.df{position:relative;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;min-height:92px;padding:10px 12px;text-align:left;cursor:pointer;font:600 18px var(--f-body);display:flex;flex-direction:column;justify-content:space-between}
.df b{font:700 34px/1 var(--f-data);color:var(--ng)}
.df.has{border-color:var(--ng);background:var(--ng-soft)}
.df-ctl{display:flex;gap:8px;margin-top:6px}
.df-ctl button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 18px var(--f-body);cursor:pointer}
.df-tot{font-weight:700;font-size:20px;margin:12px 0 0}
/* Dừng máy */
.stopbox{background:var(--ng);color:#fff;border-radius:22px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.stopbox svg{width:72px;height:72px}
.stopbox h2{font:800 34px/1.1 var(--f-body);margin:0;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.wk h1.wk-h,.wk h2.wz-q,.wk .wk-done h2{text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.stopbox p{margin:0;font-size:18px}
.stopbox .who{font:700 24px var(--f-body)}
/* Xem lại */
.rv{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.rv-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);font-size:18px}
.rv-row:last-child{border-bottom:0}
.rv-row .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.rv-row .ic svg{width:22px;height:22px}
.rv-row .ic.ok{background:var(--ok-soft);color:var(--ok)} .rv-row .ic.ng{background:var(--ng-soft);color:var(--ng)} .rv-row .ic.na{background:var(--bg);color:var(--muted)}
.rv-row .tx{flex:1;min-width:0}
.rv-row .tx small{display:block;color:var(--muted);font-size:15px}
.rv-row button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;min-height:44px;padding:0 14px;font:600 16px var(--f-body);cursor:pointer}
/* Đã lưu */
.wk-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:28px}
.wk-done .big{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.wk-done .big.ng{background:var(--ng)}
.wk-done .big svg{width:80px;height:80px}
.wk-done h2{font:800 34px var(--f-body);margin:0}
.wk-done p{margin:0;font-size:18px;color:var(--muted)}
@media (max-width:380px){ .wz-big{min-height:116px;font-size:21px} .wz-q{font-size:24px} .kp-disp b{font-size:46px} }
/* Đăng nhập: ô và nút to cho công nhân */
.login .box input{font-size:20px;min-height:58px;border-radius:12px}
.login .box .btn.primary{min-height:60px;font-size:20px;border-radius:14px}
.login .box .lbl{font-size:14px}
/* v15: máy không chạy, nhập tá/đôi */
.wk-task.off{background:var(--idle-soft);border-color:transparent;opacity:.85}
.wk-task.off .ic{background:var(--paper);color:var(--idle)} .wk-task.off .st{color:var(--muted)} .wk-task.off .go{background:var(--idle);color:#fff}
.hc i.moff,.legend i.moffi{background:repeating-linear-gradient(135deg,var(--idle-soft) 0 2px,var(--line) 2px 4px)}
.dq-boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.dq-box{display:flex;flex-direction:column;align-items:center;gap:4px;border:2.5px solid var(--line);border-radius:18px;padding:10px;background:var(--paper);color:var(--ink);cursor:pointer;font:inherit;min-height:96px;justify-content:center}
.dq-box small{font-size:18px;font-weight:700;color:var(--muted)}
.dq-box b{font:600 46px/1 var(--f-data);font-variant-numeric:tabular-nums}
.dq-box.on{border-color:var(--pen);background:var(--pen-soft)} .dq-box.on small{color:var(--pen)}
.dq input{min-height:36px;padding:4px 8px;text-align:right;font-family:var(--f-data)}
.dq small{font-size:12px;color:var(--muted)}
.df b{font-size:24px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

}

/* Nén + đóng dấu ảnh: cạnh dài tối đa 1280px (Storage) / 1024px (Firestore), JPEG ~0.7 → thường 80–250 KB */
async function compressPhoto(file, stamp){
  const maxSide = PHOTO_BACKEND==="storage" ? 1280 : 1024;
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const w0=src.width, h0=src.height, k=Math.min(1, maxSide/Math.max(w0,h0));
  const w=Math.round(w0*k), h=Math.round(h0*k);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const g=cv.getContext("2d"); g.drawImage(src,0,0,w,h);
  const fs=Math.max(14, Math.round(w/42)), pad2=Math.round(fs*0.6);
  g.fillStyle="rgba(0,0,0,.58)"; g.fillRect(0,h-fs-pad2*2,w,fs+pad2*2);

function makeBus(){ const m={}; return { on(k,f){ (m[k]=m[k]||new Set()).add(f); return ()=>m[k].delete(f); }, emit(k){ (m[k]||[]).forEach(f=>{ try{f();}catch(e){ console.error(e);} }); } }; }

    async put(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const tx=d.transaction("p","readwrite"); tx.objectStore("p").put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
    async get(k){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction("p").objectStore("p").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
    async clear(){ try{ const d=await this.open(); d.transaction("p","readwrite").objectStore("p").clear(); }catch(e){} } };
  const urlCache={};

      const sid=ls.get(K.sess,null); const u=db.users.find(x=>x.uid===sid && x.active);

      /* Cấu hình: line theo phiếu giấy, ngày lễ, thứ 7 cách tuần (+1 thứ 7 đổi sang đi làm để minh hoạ) */

      const c0=Object.assign({},DEFAULT_CFG,db.cfg||{}); delete c0.pvc;

      /* Line: [phiếu, line, người chính (có thể theo ca), dự phòng, giờ sáng, giờ chiều] */

      db.asg={map}; ls.set(K.asg,db.asg);
      /* Phiếu */
      let s=20260101; const rnd=()=>{ s|=0; s=s+0x6D2B79F5|0; let q=Math.imul(s^s>>>15,1|s); q=q+Math.imul(q^q>>>7,61|q)^q; return ((q^q>>>14)>>>0)/4294967296; };

      const pick=w=>{ let x=rnd()*w.reduce((a,b)=>a+b[1],0); for(const [k,p] of w){ x-=p; if(x<=0) return k; } return w[0][0]; };
      const gauss=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.7;
      const RS={camBien:"Máy không báo khi thả kim thử ở điểm giữa",amBao:"Âm báo nhỏ, thời gian báo ngắn",tocDo:"Băng chuyền chạy không đều",kichThuoc:"Cổ tay ngắn",deoThu:"Đeo vào bị bó ngón",lopCaoSu:"Lớp cao su không đều, có bọt khí",mayOK:"Máy hư, dừng 7h30 → 10h"};
      const MAYNG=["Máy hư, dừng 7h30 → 10h","Chổi in mòn, in không đều","Băng chuyền kẹt","Nhiệt không lên"];
      const CAPA={kim:["Cảm biến bám bụi","Vệ sinh đầu dò, hiệu chỉnh độ nhạy, kiểm lại 100% hàng từ lần kiểm trước"],caosu:["Nồng độ dung dịch nhúng thấp","Điều chỉnh nồng độ, cách ly lô, kiểm lại 100%"],saycs:["Bộ gia nhiệt hỏng","Cơ điện thay điện trở, kiểm lại hàng in trong ca"],pvc:["Chổi in mòn","Thay chổi in, kiểm lại hàng in từ lần kiểm trước"]};
      const recs=db.rec||{}; let n=0;
      const isWd=d=>workdayOf(c0,d);
      const PCw=PC.map((c,i)=>[c, i<5?6:i<9?4:2]);
      for(let dd=new Date(2026,0,1); dstr(dd)<=today; dd.setDate(dd.getDate()+1)){

        const mi=dd.getMonth(), f0=Math.max(0.35,1-mi*0.075);
        const autoRuns = rnd()<0.45;                         // PVC tự động chỉ chạy một số ngày

          const dl=c0.deadlines[ca]||"23:59";
          if(date===today && nowHM<=dl) return;
          const id=docId(f,l,date,ca); if(recs[id]) return;

          const who=(bkC && rnd()<0.1)?bkC:mainC, uid=uidOf(who), u=db.users.find(x=>x.uid===uid)||{};
          const base={id, form:f, line:l, area:areaF(f), date, month:date.slice(0,7), ca, nguoi:u.name||"", byUid:uid, nguon:"app", mau:true};
          if((l==="PVC tự động" && !autoRuns) || rnd()<0.008){ recs[id]=Object.assign(base,{off:true, ketqua:"OFF", ghiLuc:new Date(date+"T"+(ca==="sang"?"07:35":"13:05")+":00").toISOString()}); return; }
          if(rnd()<0.05*f0+0.006) return;                    // bỏ sót
          const gio= ca==="sang"?gS:gC;
          const late=rnd()<0.12*f0+0.012;
          const lh=late?(+dl.slice(0,2)+1+Math.floor(rnd()*3))+":"+pad(Math.floor(rnd()*60)):gio;
          const ck=l+ca; let code;
          if(f==="pvc") code=pick([["poly",5],["cot",4],["Cot fit",1],["15G",2],["Kinari",1],["Joshin",1],["Kombau",1],["Sagawa",1],["Junior",1]].filter(x=>l==="PVC 1"?["poly","cot","Cot fit"].includes(x[0]):l==="PVC 2"?["poly","cot","Joshin"].includes(x[0]):l==="PVC 3"?["15G","Kinari","Joshin","Sagawa","Junior"].includes(x[0]):["Kombau","15G","poly"].includes(x[0])));
          else if(f==="kim") code=pick([...PCw.slice(0,8),["poly",3],["cot",3]]);
          else code = codeOf[ck] || (codeOf[ck]=pick(PCw));
          const r=Object.assign(base,{gio, ketqua:"OK", ngItems:[], lyDo:{}, ghiChu:"", daBao:false, maHang:code, ghiLuc:new Date(date+"T"+lh.padStart(5,"0")+":00").toISOString(), photos:[]});
          if(f==="kim"){ r.items={}; FORMS.kim.items.forEach(it=>{ r.items[it.k]={trai:"OK",giua:"OK",phai:"OK"}; }); if(rnd()<0.03*f0){ const k=rnd()<0.7?"camBien":"amBao"; r.items[k][pick([["trai",1],["giua",2],["phai",1]])]="NG"; r.ngItems=[k]; } }
          if(f==="caosu"){ r.items={}; FORMS.caosu.items.forEach(it=>r.items[it.k]="OK");
            const k1=(l==="Cao su 2"?1.5:1)*f0, ct={};
            const add=(k,v)=>{ if(v>0) ct[k]=(ct[k]||0)+v; };
            add("do",pois(5*k1)); add("rach",pois(2.5*k1)); if(rnd()<0.25) add("loisoi",pois(3*k1)); if(rnd()<0.004) add("vangchi",12*(15+Math.floor(rnd()*10)));
            const nl2=pois(4*k1); for(let i=0;i<nl2;i++) add(pick([["rachnho",5],["donhieu",4],["boteo",2],["rachbo",2],["rachngon",2],["matsoi",2],["vienso",1],["ngan",1],["lungngon",1]]), 1+Math.floor(rnd()*4));
            const tong=Object.values(ct).reduce((a,b)=>a+b,0); r.loi={tong, loai:Object.keys(ct), chiTiet:ct, donVi:"doi"};
            if(rnd()<0.035*f0*(l==="Cao su 2"?1.6:1)){ const k=pick([["lopCaoSu",3],["deoThu",2],["kichThuoc",1]]); r.items[k]="NG"; r.ngItems=[k]; } }
          if(isMeasure(f)){ r.items={mayOK:"OK"};
            const T={"saycs|Cao su 1":[72,35],"saycs|Cao su 2":[95,37],"saycs|Cao su 3":[105,85],"pvc|PVC 1":[code==="poly"?255:260,49],"pvc|PVC 2":[146,520],"pvc|PVC 3":[191,55],"pvc|PVC tự động":[205,4]}[f+"|"+l];
            const exact = l==="PVC 1" || l==="PVC 2";
            r.nhietDo = exact && rnd()<0.8 ? T[0] : Math.round(T[0]+gauss()*(T[0]>150?3:2));
            r.tocDo = l==="PVC tự động" ? (rnd()<0.2?4.3:4.0) : (rnd()<0.85?T[1]:Math.round(T[1]+gauss()));

          if(r.ngItems.length){ r.ketqua="NG"; r.daBao=true; r.ngItems.forEach(k=>r.lyDo[k]= k==="mayOK"?pick(MAYNG.map(x=>[x,1])):(RS[k]||"Bất thường"));
            const age=(parseD(today)-parseD(date))/864e5, cp=CAPA[f];
            r.capa = age>7 && rnd()<0.95 ? {status:"closed", cause:cp[0], action:cp[1], byUid:leadOf(f), updatedAt:new Date(date+"T16:30:00").toISOString(), closedAt:new Date(date+"T16:30:00").toISOString()} : {status:"doing", cause:age>2?cp[0]:"", action:"", byUid:leadOf(f), updatedAt:new Date(date+"T15:00:00").toISOString()}; }
          recs[id]=r; n++;
        }));
      }
      db.rec=recs; ls.set(K.rec,recs);
      // Duyệt tháng 2 cấp cho các tháng đã qua
      const tm=today.slice(0,7);
      for(let m="2026-01"; m<tm; m=monthAdd(m,1)){ const nx=monthAdd(m,1);
        LINES.forEach(([f,l])=>{ const id=f+"_"+slug(l)+"_"+m; if(db.ap[id]) return;
          db.ap[id]={form:f,line:l,area:areaF(f),month:m,sample:true,l1:{byUid:leadOf(f),name:"",at:new Date(nx+"-03T09:00:00").toISOString(),note:""},l2:{byUid:"u_admin",name:"",at:new Date(nx+"-05T10:00:00").toISOString(),note:""}}; }); }
      ls.set(K.ap,db.ap);
      ["users","config","assign","catalog","rec","ap"].forEach(bus.emit);
      return n;
    },
    async clearSample(){
      Object.keys(db.rec).forEach(k=>{ if(db.rec[k].mau) delete db.rec[k]; }); ls.set(K.rec,db.rec);
      Object.keys(db.ap).forEach(k=>{ if(db.ap[k].sample) delete db.ap[k]; }); ls.set(K.ap,db.ap);
      const gone=db.users.filter(u=>u.sample).map(u=>u.uid); db.users=db.users.filter(u=>!u.sample); ls.set(K.users,db.users);
      const sc=ls.get(K.sec,{}); gone.forEach(u=>delete sc[u]); ls.set(K.sec,sc);
      const map=(db.asg&&db.asg.map)||{}; Object.values(map).forEach(o=>{ o.main=(o.main||[]).filter(x=>!gone.includes(x)); o.backup=(o.backup||[]).filter(x=>!gone.includes(x)); }); ls.set(K.asg,db.asg);

/* ---------- Firebase ---------- */
function FirebaseBackend(){
  const app=firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(), fs=firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true, merge:true}); }catch(e){}
  try{ fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  const st = (PHOTO_BACKEND==="storage" && FIREBASE_CONFIG.storageBucket) ? firebase.storage() : null;
  const email = u => u.trim().toLowerCase()+"@"+LOGIN_DOMAIN;
  const urlCache={};
  let profUnsub=null;
  async function loadProfile(user){
    const snap=await fs.collection("users").doc(user.uid).get();
    if(!snap.exists){
      if(user.email===email("admin")){
        const p={username:"admin", name:"Admin", role:"admin", active:true, createdAt:new Date().toISOString()};
        await fs.collection("users").doc(user.uid).set(p); return Object.assign({uid:user.uid},p);
      }
      return null;
    }
    return Object.assign({uid:user.uid}, snap.data());
  }
  const api = {
    mode:"firebase",
    async init(onAuth){
      auth.onAuthStateChanged(async user=>{
        if(!user){ onAuth(null); return; }
        try{ const p=await loadProfile(user); if(!p || !p.active){ await auth.signOut(); onAuth(null, p?"inactive":"noprofile"); return; } onAuth(p); }
        catch(e){ onAuth(null, e.code==="permission-denied"?"noprofile":"net"); }
      });
    },
    async login(username,pw){
      try{ await auth.signInWithEmailAndPassword(email(username), pw); }
      catch(e){ throw {code: /network/.test(e.code||"")?"net":"bad"}; }
    },
    async logout(){ await auth.signOut(); },
    async firstSetup(pw){
      try{ await auth.createUserWithEmailAndPassword(email("admin"), pw); }
      catch(e){ throw {code: e.code==="auth/email-already-in-use"?"exists":(e.code||"err")}; }
    },
    async changePassword(uid,oldPw,newPw){
      const u=auth.currentUser; const cred=firebase.auth.EmailAuthProvider.credential(u.email, oldPw);
      try{ await u.reauthenticateWithCredential(cred); await u.updatePassword(newPw); }
      catch(e){ throw {code: /wrong-password|invalid-credential/.test(e.code||"")?"bad":(e.code||"err")}; }
      try{ const s=await fs.collection("secrets").doc(uid).get(); if(s.exists) await fs.collection("secrets").doc(uid).set({pw:newPw, at:new Date().toISOString(), byUid:uid}); }catch(e){}
    },
    /* Mật khẩu xem được: lưu ở secrets/{uid}; chỉ quản lý và tổ trưởng phụ trách đọc được (Rules). */
    async getPassword(uid){ const s=await fs.collection("secrets").doc(uid).get(); return s.exists?(s.data().pw||null):null; },
    async setPassword(uid,newPw){
      const target=(await fs.collection("users").doc(uid).get()).data(); const old=await this.getPassword(uid);
      if(!target || old==null) throw {code:"nosecret"};
      const sec = firebase.apps.find(a=>a.name==="secondary") || firebase.initializeApp(FIREBASE_CONFIG,"secondary");
      try{ const c=await sec.auth().signInWithEmailAndPassword(email(target.username), old); await c.user.updatePassword(newPw); await sec.auth().signOut(); }
      catch(e){ try{ await sec.auth().signOut(); }catch(x){} throw {code:"nosecret"}; }
      await fs.collection("secrets").doc(uid).set({pw:newPw, at:new Date().toISOString(), byUid:auth.currentUser.uid});
    },
    async createUser(o){
      const sec = firebase.apps.find(a=>a.name==="secondary") || firebase.initializeApp(FIREBASE_CONFIG,"secondary");
      let cred;
      try{ cred=await sec.auth().createUserWithEmailAndPassword(email(o.username), o.password); }
      catch(e){ throw {code: e.code==="auth/email-already-in-use"?"exists":(e.code||"err")}; }
      await fs.collection("users").doc(cred.user.uid).set({username:o.username, name:o.name, role:o.role, areas:o.areas||[], active:true, createdAt:new Date().toISOString()});
      await fs.collection("secrets").doc(cred.user.uid).set({pw:o.password, at:new Date().toISOString(), byUid:auth.currentUser.uid});
      await sec.auth().signOut();
      return cred.user.uid;
    },
    async updateUser(uid,patch){ delete patch.password; await fs.collection("users").doc(uid).update(patch); },
    async deleteUser(uid){ try{ await fs.collection("secrets").doc(uid).delete(); }catch(e){} await fs.collection("users").doc(uid).delete(); },
    canResetPw:false,
    listenUsers(cb){ return fs.collection("users").onSnapshot(s=>cb(s.docs.map(d=>Object.assign({uid:d.id},d.data()))), e=>console.warn(e)); },
    listenDoc(name,cb){ if(name==="assign") return fs.collection("assign").onSnapshot(s=>{ const map={}; s.docs.forEach(d=>{ const v=d.data(); map[d.id]={main:v.main||[], backup:v.backup||[], shift:v.shift||{}}; }); cb({map}); }, e=>console.warn(e));
      return fs.collection("config").doc(name==="config"?"main":"catalog").onSnapshot(s=>cb(s.exists?s.data():null), e=>console.warn(e)); },
    listenApprovals(cb){ return fs.collection("approvals").onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))), e=>console.warn(e)); },
    listenRecords(from,to,areas,cb,onErr){
      let q=fs.collection("records");
      if(areas){ if(!areas.length){ cb([]); return ()=>{}; } q=q.where("area","in",areas.slice(0,30)); }

function pvcChart(recs, key){
  key=key||"nhietDo"; const unit=key==="nhietDo"?"°C":"", W=720, H=key==="nhietDo"?220:160, L=44, Rm=16, T=16, B=30;
  const pts=recs.map((r,i)=>({i,v:+r[key],r})).filter(o=>r0(o));
  function r0(o){ return o.r[key]!=null && !isNaN(o.v); }
  if(!pts.length) return `<div class="sub">${esc(t("no_data"))}</div>`;
  const vals=pts.map(o=>o.v), mn=Math.min(...vals), mx=Math.max(...vals), padv=Math.max((mx-mn)*0.15, mx<20?0.5:2);
  const lo=Math.floor(mn-padv), hi=Math.ceil(mx+padv);
  const n=recs.length, x=i=>L+(n===1?(W-L-Rm)/2:i*(W-L-Rm)/(n-1)), y=v=>T+(hi-v)*(H-T-B)/((hi-lo)||1);
  const span=hi-lo, step=span<=4?0.5:span<=12?2:span<=30?5:span<=80?10:20; let grid="";
  for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) grid+=`<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${+v.toFixed(1)}</text>`;
  const path=pts.map((o,k)=>(k?"L":"M")+x(o.i).toFixed(1)+" "+y(o.v).toFixed(1)).join(" ");
  const dense=n>60, bad=o=>o.r.ketqua==="NG";
  const tipOf=o=>fmtDate(o.r.date)+" "+caName(o.r.ca)+" · "+(o.r.maHang||"")+": "+o.v+unit;
  const dots=pts.filter(o=>!dense || bad(o)).map(o=>`<circle cx="${x(o.i)}" cy="${y(o.v)}" r="${bad(o)?5.5:3.5}" fill="${bad(o)?"var(--ng)":"var(--pen)"}" stroke="var(--paper)" stroke-width="2" data-act="openrec" data-id="${esc(o.r.id)}" data-tip="${esc(tipOf(o))}" style="cursor:pointer"></circle>`).join("");
  const every=Math.max(1,Math.ceil(n/12)); let lastM="";
  const labels = dense
    ? recs.map((r,i)=>{ const m=r.date.slice(0,7); if(m===lastM) return ""; lastM=m; return `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(i)+3}" y="${H-10}" font-size="11" fill="var(--muted)">${esc(fmtMonthShort(m))}</text>`; }).join("")
    : recs.map((r,i)=> (i%every===0)?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(fmtDateNum(r.date).slice(0,5))}</text>`:"").join("");
  const hit = dense ? pts.map(o=>`<rect x="${(x(o.i)-(W-L-Rm)/n/2).toFixed(1)}" y="${T}" width="${Math.max(1,(W-L-Rm)/n).toFixed(2)}" height="${H-T-B}" fill="transparent" data-act="openrec" data-id="${esc(o.r.id)}" data-tip="${esc(tipOf(o))}" style="cursor:pointer"/>`).join("") : "";
  const title=`<text x="${L}" y="11" font-size="11" font-weight="600" fill="var(--muted)">${esc(t(key==="nhietDo"?"meas_t":"meas_s"))}${unit?" ("+unit+")":""}</text>`;
  return `<div class="chart chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("c_pvc"))}">${title}${grid}${labels}<path d="${path}" fill="none" stroke="var(--pen)" stroke-width="${dense?1.25:2}"/>${hit}${dots}</svg></div>`;
}

/* Hàng lỗi + NG theo ngày (≤ 62 ngày) hoặc theo tháng; mỗi cột bấm để lọc */
function trendChart(recs,dates){
  if(!dates.length) return `<div class="sub">${esc(t("no_data"))}</div>`;
  const byMonth=dates.length>62, keyOf=d=>byMonth?d.slice(0,7):d;
  const keys=[...new Set(dates.map(keyOf))];
  const def={}, ng={}, n={};
  recs.forEach(r=>{ const k=byMonth?r.month:r.date; def[k]=(def[k]||0)+((r.loi&&r.loi.tong)||0); n[k]=(n[k]||0)+1; if(r.ketqua==="NG") ng[k]=(ng[k]||0)+1; });
  const W=Math.max(460,keys.length*(byMonth?56:18)+60), H=210, L=38, Rm=8, T=12, B=26;
  const max=Math.max(4,...keys.map(d=>(def[d]||0)+(ng[d]||0)));
  const top=Math.ceil(max/4)*4, bw=(W-L-Rm)/keys.length, y=v=>T+(top-v)*(H-T-B)/top;
  let g=""; for(let v=0; v<=top; v+=top/4) g+=`<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const S0=S.dash&&S.dash.sel, sk0=byMonth?"month":"day";
  let bars="";
  keys.forEach((d,i)=>{
    const x=L+i*bw+bw*0.18, w=Math.max(3,bw*0.64), a=def[d]||0, b=ng[d]||0;
    const lab=byMonth?fmtMonthLabel(d):fmtDateLong(d), on=S0&&S0.k===sk0&&S0.v===d;
    const tip=lab+"\n"+t("k_defects")+": "+fmtQty(a)+"\nNG: "+b+"\n"+t("n_checks")+": "+(n[d]||0);
    bars+=`<g class="hit ${on?"sel":""}" data-act="dsel" data-k="${sk0}" data-v="${d}" data-l="${esc(lab)}" data-tip="${esc(tip)}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
    if(a) bars+=`<rect class="bar" x="${x}" y="${y(a)}" width="${w}" height="${y(0)-y(a)}" rx="2" fill="var(--pen)" ${S0&&S0.k===sk0&&!on?'opacity=".35"':""}/>`;
    if(b) bars+=`<rect class="bar" x="${x}" y="${y(a+b)}" width="${w}" height="${Math.max(0,y(a)-y(a+b)-2)}" rx="2" fill="var(--ng)" ${S0&&S0.k===sk0&&!on?'opacity=".35"':""}/>`;
    bars+=`</g>`;
    if(byMonth || i%Math.max(1,Math.ceil(keys.length/15))===0) bars+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(byMonth?fmtMonthShort(d):String(+d.slice(8)))}</text>`;
  });
  return `<div class="legend"><span><i style="background:var(--pen)"></i>${esc(t("k_defects"))} (${esc(t("pieces"))})</span><span><i style="background:var(--ng)"></i>${esc(t("k_ng"))}</span></div><div class="chart chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("c_trend"))}">${g}${bars}</svg></div>`;
}

  recs.forEach(r=>{ const k=r.form+"|"+r.line; const o=byLine[k]=byLine[k]||{f:r.form,l:r.line,sl:[],rs:[]}; o.rs.push(r); });
  const lRows=Object.values(byLine).map(o=>{ const a=agg(o.sl); return {o, n:o.rs.length, comp:pct(a.on,a.due), ng:o.rs.filter(r=>r.ketqua==="NG").length, def:fmtQty(o.rs.reduce((s,r)=>s+((r.loi&&r.loi.tong)||0),0)), miss:a.miss, late:o.rs.filter(isLate).length, rate:rateOf(o.rs)}; }).sort((a,b)=>FORM_KEYS.indexOf(a.o.f)-FORM_KEYS.indexOf(b.o.f)||a.o.l.localeCompare(b.o.l));
  h+=`<div class="card"><h3>${esc(t("r_by_line"))}</h3><div class="tablewrap"><table><thead><tr><th>${esc(t("line_machine"))}</th><th>${esc(t("area"))}</th><th class="num">${esc(t("col_checks"))}</th><th class="num">${esc(t("col_compliance"))}</th><th class="num">NG</th><th class="num">${esc(t("col_def"))}</th><th class="num">${esc(t("col_l2"))}</th><th class="num">${esc(t("s_late"))}</th><th class="num">${esc(t("s_miss"))}</th></tr></thead>
    <tbody>${lRows.map(x=>`<tr><td>${esc(x.o.l)} <span class="sub">${esc(tx(FORMS[x.o.f]))}</span></td><td>${esc(areaName(areaOfLine(x.o.f,x.o.l)))}</td><td class="num mono">${x.n}</td><td class="num mono">${x.comp}</td><td class="num mono">${x.ng?`<span style="color:var(--ng)">${x.ng}</span>`:0}</td><td class="num mono">${x.def}</td><td class="num mono">${x.rate}</td><td class="num mono">${x.late}</td><td class="num mono">${x.miss}</td></tr>`).join("")}</tbody></table></div></div>`;
  // Pareto + hạng mục
  const tot={}; let unk=0; recs.forEach(r=>{ const l=r.loi||{}; if(!l.tong) return; const ct=l.chiTiet||{}; if(Object.keys(ct).length) Object.entries(ct).forEach(([k,v])=>tot[k]=(tot[k]||0)+v); else unk+=l.tong; });
  const all=Object.values(tot).reduce((a,b)=>a+b,0)+unk; let cum=0;
  let par=Object.keys(tot).map(k=>({label:defName(k), v:tot[k]})).sort((a,b)=>b.v-a.v); if(unk) par.push({label:t("unclassified"),v:unk});
  par=par.map(r=>{ cum+=r.v; return Object.assign(r,{text:fmtQty(r.v)+" · "+Math.round(r.v/all*100)+"%", sub:"∑ "+Math.round(cum/all*100)+"%"}); });
  const itemCnt={}; recs.forEach(r=>recNgKeys(r).forEach(k=>{ const key=r.form+"|"+k; itemCnt[key]=(itemCnt[key]||0)+1; }));
  const items=Object.entries(itemCnt).map(([key,v])=>{ const [f,k]=key.split("|"); return {label:tx(itemOf(f,k)), sub:tx(FORMS[f]), v, ng:true, text:v+" "+t("times")}; }).sort((a,b)=>b.v-a.v).slice(0,8);
  h+=`<div class="dgrid"><div class="card"><h3>${esc(t("r_top_def"))}</h3>${hbars(par)}</div><div class="card"><h3>${esc(t("r_top_items"))}</h3>${hbars(items,{empty:t("none_ng")})}</div></div>`;
  h+=`<div class="savebar"><button class="btn" data-act="csvperiod">${esc(t("csv_period"))}</button><button class="btn ghost" data-act="csvperiodraw">${esc(t("csv_all"))}</button></div>`;
  S._period={mRows,lRows,recs,title};
  return h;
}

    function signedIn() { return request.auth != null; }
    function prof() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function active() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)) && prof().active == true; }
    function isAdmin() { return active() && prof().role == 'admin'; }
    function isLeader() { return active() && prof().role in ['admin', 'leader']; }
    // Khu vực: quản lý thấy tất cả; người khác chỉ thấy khu vực trong hồ sơ
    function inArea(a) { return isAdmin() || (active() && a in prof().get('areas', [])); }
    // Người xem báo cáo: đọc mọi khu vực, không ghi gì
    function isViewer() { return active() && prof().role == 'viewer'; }
    function canSee(a) { return isViewer() || inArea(a); }
    function isLeaderOnly() { return active() && prof().role == 'leader'; }

    match /users/{uid} {
      allow read: if active();
      allow create: if isAdmin()
        || (isLeader() && request.resource.data.role == 'staff'
            && request.resource.data.areas.size() > 0
            && request.resource.data.areas.hasOnly(prof().get('areas', [])))
        || (signedIn() && request.auth.uid == uid
            && request.auth.token.email == 'admin@${LOGIN_DOMAIN}'
            && request.resource.data.role == 'admin');
      allow update: if isAdmin()
        || (isLeader() && resource.data.role == 'staff' && request.resource.data.role == 'staff'
            && resource.data.get('areas', []).hasAny(prof().get('areas', []))
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['active', 'areas'])
            && request.resource.data.get('areas', []).size() > 0
            && request.resource.data.get('areas', []).toSet().difference(resource.data.get('areas', []).toSet()).hasOnly(prof().get('areas', []))
            && resource.data.get('areas', []).toSet().difference(request.resource.data.get('areas', []).toSet()).hasOnly(prof().get('areas', [])))
        || (active() && request.auth.uid == uid
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['lang']));
      allow delete: if isAdmin() && request.auth.uid != uid;
    }
    match /config/{doc} {
      allow read: if active();
      allow write: if isAdmin() || (doc == 'catalog' && isLeader());
    }
    match /records/{id} {
      allow read: if canSee(resource.data.area);
      allow create: if inArea(request.resource.data.area)
        && (isLeader() || (request.resource.data.byUid == request.auth.uid && !('capa' in request.resource.data)));
      allow update: if inArea(resource.data.area) && inArea(request.resource.data.area)
        && (isLeader() || (resource.data.byUid == request.auth.uid
                           && request.resource.data.byUid == request.auth.uid
                           && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['capa']))
            // phiếu "máy không chạy": người cùng khu được huỷ hoặc thay bằng phiếu kiểm thật
            || (resource.data.get('off', null) != null && !('capa' in request.resource.data)
                && (request.resource.data.byUid == request.auth.uid || request.resource.data.get('off', null) == false)));
      allow delete: if isAdmin();
    }
    match /photos/{id} {
      allow read: if canSee(resource.data.area);
      allow create: if inArea(request.resource.data.area) && request.resource.data.data.size() < 900000;
      allow delete: if isAdmin();
    }
    match /assign/{id} {
      allow read: if active();
      allow create: if isLeader() && inArea(request.resource.data.area);
      allow update: if isLeader() && inArea(resource.data.area) && inArea(request.resource.data.area);
      allow delete: if isAdmin();
    }
    match /approvals/{id} {
      allow read: if active();
      allow create: if isAdmin() || (isLeaderOnly() && inArea(request.resource.data.area) && !('l2' in request.resource.data));
      allow update: if isAdmin();
      allow delete: if isAdmin() || (isLeaderOnly() && inArea(resource.data.area) && !('l2' in resource.data));
    }
    // Mật khẩu xem được: quản lý (mọi người), tổ trưởng (nhân viên kiểm tra cùng khu)
    match /secrets/{uid} {
      allow read, write: if isAdmin()
        || (isLeaderOnly()
            && get(/databases/$(database)/documents/users/$(uid)).data.role == 'staff'
            && get(/databases/$(database)/documents/users/$(uid)).data.get('areas', []).hasAny(prof().get('areas', [])));
    }
  }
}`;

function workerTasks(){
  const today=todayStr(), out=[];
  myForms().forEach(f=>myLines(f).forEach(l=>CAS.forEach(ca=>{
    const a=asgOf(f,l); if(([...(a.main||[]),...(a.backup||[])]).includes(S.me.uid) && !worksCa(a,S.me.uid,ca)) return;   // chỉ làm 1 ca
    const r=recFor(f,l,today,ca), si=slotInfo(f,l,today,ca);
    let st;
    if(r) st=r.ketqua==="NG"?"ng":"ok";
    else if(!isWorkday(today)) return;
    else if(si.moff) st="off";
    else if(si.state==="miss") st="late";
    else st = (ca==="chieu" && hhmm()<"11:30") ? "after" : "todo";
    out.push({f,l,ca,st,r});
  })));
  const rank={late:0,todo:1,after:2,ng:3,ok:4,off:5};
  out.sort((a,b)=>rank[a.st]-rank[b.st] || CAS.indexOf(a.ca)-CAS.indexOf(b.ca) || FORM_KEYS.indexOf(a.f)-FORM_KEYS.indexOf(b.f) || a.l.localeCompare(b.l));

}

function ngDetail(k){
  const d=S.draft, ev=evalDraft(d), why=String((d.lyDo||{})[k]||"");
  let h="";
  if(d.form==="kim"){
    const v=d.items[k]||{};
    h+=`<div class="wz-sec"><span class="wz-lbl">${esc(t("w_which"))}</span><div class="wz-pts">${POINTS.map(([p,pn])=>{ const ng=v[p]==="NG"; return `<button class="wz-pt ${ng?"ng":"ok"}" data-act="w-pt" data-k="${k}" data-p="${p}" aria-pressed="${ng}">${ng?IC.ng:IC.ok}<span>${esc(tx(pn))}</span></button>`; }).join("")}</div></div>`;
  }
  const chips=pastReasons(d.form,k);
  h+=`<div class="wz-sec"><span class="wz-lbl">${esc(t("w_why"))}</span>
    ${chips.length?`<div class="wz-chips">${chips.map(c=>`<button class="wz-chip ${why===c?"on":""}" data-act="w-why" data-k="${k}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
    <label class="sub" for="w-why-${k}" style="font-size:15px">${esc(t("w_why_other"))}</label>
    <input class="wz-in" id="w-why-${k}" data-wwhy="${k}" value="${esc(chips.includes(why)?"":why)}" autocomplete="off"></div>`;
  const pmo=cfg().photoMode||"opt";
  if(ev.needPhotos.includes(k) || pmo==="item" || pmo==="opt"){
    const ph=d.photos[k];
    h+=`<div class="wz-sec">${ph?`<div class="wz-shot"><img src="${ph.url}" alt=""><label class="wz-cam done" style="flex:1">${IC.cam}<span>${esc(t("w_photo_again"))}</span><input type="file" accept="image/*" capture="environment" data-photo="${k}" hidden></label></div>`
      :`<label class="wz-cam">${IC.cam}<span>${esc(t(ev.needPhotos.includes(k)?"w_photo":"w_photo_opt"))}</span><input type="file" accept="image/*" capture="environment" data-photo="${k}" hidden></label>`}
      ${d.processing?`<div class="sub">${esc(t("processing"))}</div>`:""}</div>`;
  }
  return h;
}
function needText(k){
  const d=S.draft, ev=evalDraft(d);
  if(d.form==="kim"){ const v=d.items[k]||{}; if(!POINTS.some(([p])=>v[p]==="NG")) return t("w_need_pts"); }
  if(!String((d.lyDo||{})[k]||"").trim()) return t("w_need_why");
  if(ev.needPhotos.includes(k) && !d.photos[k] && !d.oldPhotos[k]) return t("w_need_photo");
  return "";
}
function keypad(field, unit, decimal, act){
  const d=S.draft, v=String(field.startsWith("~")?S.wz.de[field.slice(1)]:(d[field]||""));
  return `${act?"":`<div class="kp-disp"><b>${esc(v||"0")}</b>${unit?`<span>${esc(unit)}</span>`:""}</div>`}
    <div class="kp">${["1","2","3","4","5","6","7","8","9", decimal?".":"", "0","del"].map(x=>x===""?`<span></span>`:`<button class="${x==="del"?"fn":""}" data-act="${act||"w-kp"}" data-f="${field}" data-v="${x}" aria-label="${x==="del"?esc(t("w_kp_del")):x}">${x==="del"?esc(t("w_kp_del")):x}</button>`).join("")}</div>`;
}
/* Nhập số lượng 1 loại lỗi: 2 ô Tá + Đôi */
function defEditor(){
  const E=S.wz.de, x=(catalog().defects||[]).find(o=>o.id===E.id)||{vi:E.id}, n=(parseInt(E.ta,10)||0)*12+(parseInt(E.doi,10)||0);
  const box=(k,lb)=>`<button class="dq-box ${E.f===k?"on":""}" data-act="w-dqf" data-v="${k}"><small>${esc(lb)}</small><b>${esc(E[k]||"0")}</b></button>`;
  return `<h2 class="wz-q">${esc(t("w_q_dq",{x:tx(x)}))}</h2>${x.l2?`<p class="wz-hint">${esc(t("grp_l2"))}</p>`:""}
    <div class="dq-boxes">${box("ta",t("unit_ta"))}${box("doi",t("unit_doi"))}</div><p class="wz-hint" style="text-align:center">${esc(t("w_pick_box"))}</p>
    ${keypad("~"+E.f,"",false,"w-dkp")}
    <button class="wz-next save" data-act="w-dqok" ${n>0?"":"disabled"} style="margin-top:14px">${IC.ok}<span>${esc(t("w_done"))}${n?" · "+esc(fmtQty(n)):""}</span></button>
    ${S.draft.loi[E.id]?`<button class="wz-ghost" data-act="w-dqdel">${esc(t("w_del_def"))}</button>`:`<button class="wz-ghost" data-act="w-dqcancel">${esc(t("w_back"))}</button>`}`;
}
function renderWizard(){
  const d=S.draft, f=d.form, st=wzSteps(), key=S.wz.key, i=Math.max(0,st.indexOf(key)), ev=evalDraft(d);
  const ctx=`<div class="wz-ctx">${IC[FORMS[f].icon||f]}<span><b>${esc(d.line)}</b> · ${esc(caName(d.ca))}${d.maHang&&key!=="code"?" · "+esc(d.maHang):""}</span></div>`;
  let h=`<div class="wz-bar"><button class="wz-ib" data-act="w-back" aria-label="${esc(t("w_back"))}">${IC.back}</button>
    <div class="wz-prog"><small>${esc(t("w_step",{i:i+1,n:st.length}))}</small><div class="wz-dots">${st.map((s,j)=>`<i class="${j<i?"done":j===i?"cur":""}"></i>`).join("")}</div></div>
    <button class="wz-ib" data-act="w-quit" aria-label="${esc(t("w_home"))}">${IC.close}</button></div>${ctx}`;
  const next=(ok,label,cls)=>`<button class="wz-next ${cls||""}" data-act="${cls==="save"?"w-save":"w-next"}" ${ok?"":"disabled"}>${esc(label||t("w_next"))}${cls==="save"?"":IC.go}</button>`;

  if(key==="code"){
    const prods=activeProducts(f), recent=ls.get("kcb.codes_"+f,[])||[], q=(S.wz.q||"").trim().toLowerCase();
    let list=prods.slice().sort((a,b)=>{ const ia=recent.indexOf(a.code), ib=recent.indexOf(b.code); return (ia<0?99:ia)-(ib<0?99:ib) || a.code.localeCompare(b.code); });
    if(q) list=list.filter(x=>x.code.toLowerCase().includes(q)||String(x.name||"").toLowerCase().includes(q));
    const mo=offFor(f,d.line,d.date,d.ca);
    if(mo) h+=`<div class="wz-need" style="background:var(--idle-soft);color:var(--ink)">${esc(t("off_note"))}</div>`;
    h+=`<h2 class="wz-q">${esc(t("w_q_code"))}</h2>`;
    if(!prods.length) h+=`<div class="wk-empty">${esc(t("no_products"))}</div>`;
    else { if(prods.length>8) h+=`<input class="wz-in" id="w-codeq" type="search" placeholder="${esc(t("w_find"))}" value="${esc(S.wz.q||"")}" style="margin-bottom:12px" autocomplete="off">`;
      h+=`<div class="wz-tiles">${list.map(x=>`<button class="wz-tile ${d.maHang===x.code?"on":""}" data-act="w-code" data-v="${esc(x.code)}"><b>${esc(x.code)}</b>${x.name&&x.name!==x.code?`<span>${esc(x.name)}</span>`:""}</button>`).join("")||`<span class="sub">${esc(t("no_match"))}</span>`}</div>`; }
    if(!mo && !S.overwrite) h+=`<button class="wz-ghost" data-act="w-off" style="margin-top:22px;display:flex;gap:10px;align-items:center;justify-content:center">${IC.off.replace('<svg ','<svg width="22" height="22" ')}<span>${esc(t("off_btn"))}</span></button>`;
    return h;
  }
  if(wzItems(f).includes(key)){
    const it=itemOf(f,key), s=itemState(key);
    h+=`<h2 class="wz-q">${esc(tx(it.q||it))}</h2>`;
    if(it.type==="num"){ h+=keypad(key, it.unit||"", true); return h+next(s==="ok"); }
    if(f==="kim") h+=`<p class="wz-hint">${esc(t("w_kim_hint"))}</p>`;
    h+=`<div class="wz-yn"><button class="wz-big pass ${s==="ok"?"on":""}" data-act="w-pass" data-k="${key}">${IC.ok}<span>${esc(t("w_pass"))}</span></button>
      <button class="wz-big fail ${s==="ng"?"on":""}" data-act="w-fail" data-k="${key}">${IC.ng}<span>${esc(t("w_fail"))}</span></button></div>`;
    if(s==="ng"){ h+=ngDetail(key); const ok=ngDetailOk(key); h+=(!ok?`<div class="wz-need">${esc(needText(key))}</div>`:"")+next(ok); }
    else if(s==="ok") h+=next(true);
    return h;
  }
  if(key==="defects"){
    if(S.wz.de) return h+defEditor();
    const defs=activeDefects(f), tot=Object.values(d.loi||{}).reduce((s,v)=>s+(+v||0),0);
    h+=`<h2 class="wz-q">${esc(t("w_q_def"))}</h2>`;
    if(!tot) h+=`<button class="wz-next save" data-act="w-nodef" style="margin:0 0 16px">${IC.ok}<span>${esc(t("w_no_def"))}</span></button>`;
    const tile=x=>{ const n=+d.loi[x.id]||0; return `<button class="df ${n?"has":""}" data-act="w-def" data-v="${esc(x.id)}"><span>${esc(tx(x))}</span><b>${n?esc(fmtQty(n)):""}</b></button>`; };
    const grp=l2=>{ const L=defs.filter(x=>!!x.l2===l2); return L.length?`<div class="wz-sec"><span class="wz-lbl">${esc(t(l2?"grp_l2":"grp_def"))}</span><div class="df-grid">${L.map(tile).join("")}</div></div>`:""; };
    h+=`<p class="wz-hint">${esc(t("w_def_tap"))}</p>${grp(false)}${grp(true)}`;
    if(tot) h+=`<div class="df-tot">${esc(t("w_def_total",{n:fmtQty(tot)}))}</div>`;
    return h+(tot?next(true):"");
  }
  if(key==="stop"){
    const who=cfg().contacts[f]||"";
    h+=`<div class="stopbox">${IC.stop}<h2>${esc(t("w_stop"))}</h2><p>${esc(t("w_stop_call"))}</p><div class="who">${esc(who)}</div></div>
      <button class="wz-next ${d.daBao?"save":""}" data-act="w-called" style="margin-top:16px">${d.daBao?IC.ok:""}<span>${esc(t("w_stop_done"))}</span></button>`;
    return h;
  }
  if(key==="review"){
    h+=`<h2 class="wz-q">${esc(t("w_review"))}</h2><p class="wz-hint">${esc(t("w_auto"))}: ${esc(fmtDateLong(d.date))} · ${esc(d.gio)}</p><div class="rv">`;
    const row=(state,title,sub,step)=>`<div class="rv-row"><span class="ic ${state}">${state==="ok"?IC.ok:state==="ng"?IC.ng:""}</span><span class="tx">${esc(title)}${sub?`<small>${esc(sub)}</small>`:""}</span>${step?`<button data-act="w-goto" data-v="${step}">${esc(t("w_change"))}</button>`:""}</div>`;
    h+=row("ok", t("w_code")+": "+d.maHang, "", "code");
    wzItems(f).forEach(k=>{ const it=itemOf(f,k), s=itemState(k)||"na";
      let sub=""; if(it.type==="num") sub=String(d[k])+(it.unit?" "+it.unit:""); if(s==="ng") sub=[sub, f==="kim"?POINTS.filter(([p])=>(d.items[k]||{})[p]==="NG").map(([p,pn])=>tx(pn)).join(", "):"", (d.lyDo||{})[k]||""].filter(Boolean).join(" · ");
      h+=row(it.type==="num"?"ok":s, tx(it), sub, k); });
    if(activeDefects(f).length){
      const tot=Object.values(d.loi||{}).reduce((s,v)=>s+(+v||0),0);
      h+=row(tot?"ng":"ok", t("w_defs")+": "+(tot?fmtQty(tot):t("w_nothing")), tot?Object.entries(d.loi).filter(([k,v])=>v>0).map(([k,v])=>defName(k)+" "+fmtQty(v)).join(", "):"", "defects");
    }
    h+=`</div>`;
    const okAll = !ev.missing.length && !(ev.noReason||[]).length && !ev.missingPhotos.length && (ev.ketqua!=="NG"||d.daBao);
    if(S.saveMsg && S.saveMsg.cls==="err") h+=`<div class="wz-need err">${esc(S.saveMsg.t)}</div>`;
    h+=`<button class="wz-next save" data-act="w-save" ${okAll&&!S.saving?"":"disabled"}>${IC.ok}<span>${esc(S.saving?(S.prog||t("w_saving")):t("w_save"))}</span></button>`;
    return h;
  }
  return h;
}

}

/* ---------- Sự kiện ---------- */
async function workerClick(a,b){
  const d=S.draft;
  switch(a){
    case "w-logout": await doLogout(); document.body.classList.remove("wkmode"); return true;
    case "w-open": wzOpen(b.dataset.f,b.dataset.l,b.dataset.ca); return true;
    case "w-home": S.wz=null; S.draft=newDraft(); render(); return true;
    case "w-back": if(S.wz && S.wz.de){ S.wz.de=null; render(); return true; } wzBack(); return true;
    case "w-quit": wzQuit(false); return true;
    case "w-quit2": wzQuit(true); return true;
    case "w-goto": wzGo(b.dataset.v); return true;
    case "w-next": wzNext(); return true;
    case "w-code": d.maHang=b.dataset.v; S.wz.q=""; wzNext(); return true;
    case "w-pass": { const k=b.dataset.k; if(d.form==="kim") d.items[k]={trai:"OK",giua:"OK",phai:"OK"}; else d.items[k]="OK"; delete S.wz.fail[k]; delete d.lyDo[k]; if(d.photos[k]){ try{URL.revokeObjectURL(d.photos[k].url);}catch(e){} delete d.photos[k]; } wzNext(); return true; }
    case "w-fail": { const k=b.dataset.k; S.wz.fail[k]=true; if(d.form==="kim"){ const v=d.items[k]||{}; if(!POINTS.some(([p])=>v[p]==="NG")) d.items[k]={trai:"OK",giua:"OK",phai:"OK"}; } else d.items[k]="NG"; render(); return true; }
    case "w-pt": { const k=b.dataset.k, p=b.dataset.p, v=d.items[k]; v[p]= v[p]==="NG"?"OK":"NG"; render(); return true; }
    case "w-why": { const k=b.dataset.k; d.lyDo[k]= d.lyDo[k]===b.dataset.v ? "" : b.dataset.v; render(); return true; }
    case "w-kp": { const f=b.dataset.f, v=b.dataset.v; let s=String(d[f]||"");
      if(v==="del") s=s.slice(0,-1); else if(v==="."){ if(!s.includes(".")) s=(s||"0")+"."; } else if(s.replace(".","").length<7) s=(s==="0"?"":s)+v;
      d[f]=s; render(); return true; }
    case "w-def": { const k=b.dataset.v, n=+d.loi[k]||0; S.wz.de={id:k, ta:n>=12?String(Math.floor(n/12)):"", doi:n%12?String(n%12):"", f:n>=12?"ta":"doi"}; window.scrollTo(0,0); render(); return true; }
    case "w-dqf": S.wz.de.f=b.dataset.v; render(); return true;
    case "w-dkp": { const E=S.wz.de, k=E.f, v=b.dataset.v; let x=String(E[k]||""); if(v==="del") x=x.slice(0,-1); else if(x.replace(/^0+/,"").length<(k==="doi"?3:4)) x=(x==="0"?"":x)+v; E[k]=x; render(); return true; }
    case "w-dqok": { const E=S.wz.de, n=(parseInt(E.ta,10)||0)*12+(parseInt(E.doi,10)||0); if(n>0) d.loi[E.id]=n; else delete d.loi[E.id]; S.wz.de=null; render(); return true; }
    case "w-dqdel": delete d.loi[S.wz.de.id]; S.wz.de=null; render(); return true;
    case "w-dqcancel": S.wz.de=null; render(); return true;
    case "w-off": openModal(`<h3 style="font-size:22px">${esc(t("off_q"))}</h3><p class="sub" style="font-size:16px">${esc(d.line)} · ${esc(tx(FORMS[d.form]))}</p><div style="display:flex;flex-direction:column;gap:10px">
      <button class="wz-next" data-act="w-off1">${esc(t("off_one"))} · ${esc(caName(d.ca))}</button>${d.ca==="sang"?`<button class="wz-next" data-act="w-off2">${esc(t("off_day"))}</button>`:""}<button class="wz-ghost" data-act="closemodal">${esc(t("w_back"))}</button></div>`, true); return true;
    case "w-off1": case "w-off2": { closeModal(); const ok=await saveOff(d.form,d.line,d.date, a==="w-off2"?CAS:[d.ca]); if(ok){ toast(t("off_saved")); S.wz=null; S.draft=newDraft(); window.scrollTo(0,0); } render(); return true; }
    case "w-nodef": d.loi={}; wzNext(); return true;
    case "w-called": d.daBao=!d.daBao; if(d.daBao) wzNext(); else render(); return true;
    case "w-save": { const snap={line:d.line, ca:d.ca, gio:d.gio, ng:evalDraft(d).ketqua==="NG"}; S.quietToast=true; await save(); S.quietToast=false;
      if(S.saveMsg && S.saveMsg.cls==="ok"){ S.wz={done:snap}; S.saveMsg=null; window.scrollTo(0,0); } render(); return true; }
  }
  return false;
}
function workerInput(tg){
  const d=S.draft; if(!d || !S.wz) return false;
  if(tg.dataset && tg.dataset.wwhy){ d.lyDo[tg.dataset.wwhy]=tg.value; const nx=document.querySelector(".wz-next"); const k=tg.dataset.wwhy;
    if(nx){ nx.disabled=!ngDetailOk(k); } const nd=document.querySelector(".wz-need"); if(nd) nd.textContent=needText(k); return true; }
  if(tg.id==="w-codeq"){ S.wz.q=tg.value; render(); return true; }
  return false;
}
document.addEventListener("keydown", e=>{
  if(!S.wz || S.wz.done || !S.me || S.me.role!=="staff") return;
  const ae=document.activeElement; if(ae && /INPUT|TEXTAREA/.test(ae.tagName)) return;
  const btn=document.querySelector('[data-act="w-kp"],[data-act="w-dkp"]'); if(!btn) return;
  const act=btn.dataset.act, map={Backspace:"del",".":".",",":"."}; const v=/^[0-9]$/.test(e.key)?e.key:map[e.key]; if(!v) return;
  const b=document.querySelector(`[data-act="${act}"][data-v="${v}"]`); if(b){ e.preventDefault(); workerClick(act,b); }
});

/* =====================================================================
   RENDER, SỰ KIỆN, KHỞI ĐỘNG
   ===================================================================== */
let queued=false;
function render(){
  if(queued) return; queued=true;
  requestAnimationFrame(()=>{ queued=false; draw(); });
}
function draw(){
  { const tp=document.getElementById("tip"); if(tp) tp.hidden=true; }
  document.documentElement.lang = LANG==="ja"?"ja":"vi";
  document.body.classList.toggle("ja", LANG==="ja");
  if(!S.ready) return;
  if(!S.me || S.me.role!=="staff") document.body.classList.remove("wkmode");
  if(!S.me){ const a=document.activeElement, id=a&&a.id; renderLogin(); if(id){ const el=document.getElementById(id); if(el) el.focus(); } return; }
  const a=document.activeElement, aid=a&&a.id, sel=(a&&a.selectionStart!=null)?[a.selectionStart,a.selectionEnd]:null;
  if(!$("#view") || $("#app").dataset.shell!==S.me.uid+LANG+S.tab+tabsFor().join()+(navigator.onLine?"1":"0")){
    $("#app").innerHTML=shell(); $("#app").dataset.shell=S.me.uid+LANG+S.tab+tabsFor().join()+(navigator.onLine?"1":"0");
  }
  refReg.clear();
  /* Cài đặt: giữ các ô đang sửa dở khi màn hình vẽ lại (bấm chip, chọn ngày…) */
  const keep = (S.tab==="settings" && S.setDirty && S.setDirty.size) ? [...S.setDirty].map(id=>{ const e=document.getElementById(id); return e?[id,e.value]:null; }).filter(Boolean) : null;
  const v={work:renderWork, entry:renderEntry, today:renderToday, capa:renderCapa, dash:renderDash, report:renderReport, catalog:renderCatalog, assign:renderAssign, users:renderUsers, settings:renderSettings}[S.tab];
  $("#view").innerHTML=v?v():"";
  if(keep) keep.forEach(([id,val])=>{ const e=document.getElementById(id); if(e && e.value!==val){ e.value=val; const btn=document.getElementById(id+"-btn"); if(btn && val){ const sp=btn.querySelector("span"); if(sp) sp.textContent=btn.dataset.kind==="month"?fmtMonthLabel(val):fmtDateLong(val); } } });
  if(aid){ const el=document.getElementById(aid); if(el && el!==a){ el.focus({preventScroll:true}); if(sel) try{el.setSelectionRange(sel[0],sel[1]);}catch(e){} } }
  hydrate();
  if(S.focusDef){ const el=document.querySelector(`[data-defq="${CSS.escape(S.focusDef)}"][data-part="ta"]`); S.focusDef=null; if(el) el.focus(); }
}
function renderBg(){
  const a=document.activeElement;
  if(a && a.closest && a.closest("#view") && a.matches("input:not([type=checkbox]):not([type=file]),textarea")){ S.pendingRender=true; return; }
  render();
}
document.addEventListener("focusout", ()=>{ if(S.pendingRender){ S.pendingRender=false; setTimeout(render,0); } });
function hydrate(){
  document.querySelectorAll("img[data-pref]").forEach(async img=>{
    const ref=refReg.get(img.dataset.pref); if(!ref) return;
    try{ const u=await S.B.photoURL(ref); if(u) img.src=u; }catch(e){}
  });
}
function setTab(tb){ if(tb!==S.tab){ S.setDirty=new Set(); S.cfgSat=null; S.cfgWd=null; S.cfgDays=null; } if(tb==="catalog"){ S.catDraft=null; S.catMsg=null; } if(tb==="assign") S.asgDraft=null; S.tab=tb; syncSubs(); render(); window.scrollTo(0,0); }

/* ---------- Modal ---------- */
function openModal(html, narrow){ $("#modal").innerHTML=`<div class="modal" data-act="closemodal-bg"><div class="box ${narrow?"narrow":""}" role="dialog" aria-modal="true">${html}</div></div>`; const f=$("#modal input,#modal button"); if(f) f.focus(); }
function closeModal(){ $("#modal").innerHTML=""; }

async function doLogin(){
