const withTimeout=(p,ms)=>Promise.race([p, new Promise(r=>setTimeout(()=>r("__timeout"),ms))]);
async function save(){
  const d=S.draft, ev=evalDraft(d);
  const fail=(k,v)=>{ S.saveMsg={cls:"err",t:t(k,v)}; render(); };
  if(ev.missing.length) return fail("missing",{x:ev.missing.join(", ")});
  if(ev.noReason && ev.noReason.length) return fail("need_reason",{x:ev.noReason.join(", ")});
  if(ev.ketqua==="NG" && !d.daBao) return fail("need_confirm");
  if(ev.missingPhotos.length) return fail("need_photo",{x:ev.missingPhotos.map(k=>photoLabel(d.form,k)).join(", ")});
  const id=docId(d.form,d.line,d.date,d.ca);
  let existing=recFor(d.form,d.line,d.date,d.ca) || (S.B.getRecord? await S.B.getRecord(id).catch(()=>null) : null);
  if(existing && "off" in existing) existing=null;   // phiếu "máy không chạy" được thay bằng phiếu kiểm thật
  if(existing && S.me.role==="staff" && existing.byUid && existing.byUid!==S.me.uid) return fail("not_owner",{who:existing.nguoi||""});
  S.saving=true; S.saveMsg=null; render();
  const month=d.date.slice(0,7);
  const photos=[];
  Object.entries(d.oldPhotos).forEach(([k,p])=>{ if(!d.photos[k]) photos.push(p); });
  const news=Object.entries(d.photos);
  try{
    for(let i=0;i<news.length;i++){
      S.prog=t("uploading",{i:i+1,n:news.length}); render();
      const [k,p]=news[i];
      const ref=await S.B.putPhoto(p.blob,{recId:id,month,key:k,area:areaOfLine(d.form,d.line)});
      photos.push(Object.assign({key:k, size:p.size, w:p.w, h:p.h, takenAt:p.takenAt}, ref));
    }
  }catch(e){ S.saving=false; S.prog=""; return fail("photo_fail",{c:e.code||e.message||"err"}); }
  const byUid = existing && existing.byUid && S.me.role!=="staff" && S.overwrite ? existing.byUid : S.me.uid;
  const lyDo={}; ev.ng.forEach(k=>{ const v=String((d.lyDo||{})[k]||"").trim(); if(v) lyDo[k]=v; });
  const rec={id, form:d.form, line:d.line, maHang:d.maHang.trim(), lyDo, area:areaOfLine(d.form,d.line), date:d.date, month, ca:d.ca, gio:d.gio, byUid, nguoi: byUid===S.me.uid?S.me.name:(existing.nguoi||userName(byUid)),
    ketqua:ev.ketqua, ngItems:ev.ng, ghiChu:d.ghiChu.trim(), daBao:ev.ketqua==="NG"?!!d.daBao:false, nguon:"app", ghiLuc:(existing&&existing.ghiLuc&&S.overwrite&&byUid!==S.me.uid)?existing.ghiLuc:new Date().toISOString(), suaBoi: (existing?S.me.uid:null), photos};
  if(d.form==="kim") rec.items=JSON.parse(JSON.stringify(d.items));
  if(d.form!=="kim") rec.items=Object.assign({},d.items);
  { const ct={}; let tong=0; Object.entries(d.loi||{}).forEach(([k,v])=>{ v=Math.round(+v||0); if(v>0){ ct[k]=v; tong+=v; } }); if(tong || activeDefects(d.form).length) rec.loi={tong, loai:Object.keys(ct), chiTiet:ct, donVi:"doi"}; }
  if(existing && existing.capa) rec.capa=existing.capa;
  numItems(d.form).forEach(it=>{ rec[it.k]=parseFloat(d[it.k]); });
  try{
    S.prog=t("saving"); render();
    const res=await withTimeout(S.B.saveRecord(rec), 8000);
    if(res==="__timeout"){ S.records.set(id,rec); }
    ls.set("kcb.lastForm",d.form); ls.set("kcb.lastLine_"+d.form,d.line); { const code=d.maHang.trim(), key="kcb.codes_"+d.form; ls.set(key,[code,...(ls.get(key,[])||[]).filter(x=>x!==code)].slice(0,8)); }
    Object.values(d.photos).forEach(p=>{ try{URL.revokeObjectURL(p.url);}catch(e){} });
    if(!S.quietToast) toast(ev.ketqua==="NG"?t("saved_ng"):t("saved_toast",{f:tx(FORMS[d.form]),l:d.line}));
    const ml=myLines(d.form), nx=ml[(ml.indexOf(d.line)+1)%Math.max(1,ml.length)]||d.line; S.draft=newDraft(d.form,nx,d.date,d.ca); S.overwrite=false;
    S.saveMsg={cls:"ok",t:t("saved_at",{t:hhmm()})};
  }catch(e){ S.saveMsg={cls:"err",t: e.code==="permission-denied"?t("perm_err"):t("save_fail",{c:e.code||"err"})}; }
  S.saving=false; S.prog=""; render();
}
/* Báo máy không chạy: ghi 1 phiếu off cho mỗi ca chưa có phiếu kiểm */
async function saveOff(form,line,date,cas){
  const out=[];
  for(const ca of cas){
    if(recFor(form,line,date,ca)) continue;
    const id=docId(form,line,date,ca);
    out.push({id, form, line, area:areaOfLine(form,line), date, month:date.slice(0,7), ca, off:true, ketqua:"OFF", byUid:S.me.uid, nguoi:S.me.name, nguon:"app", ghiLuc:new Date().toISOString()});
  }
  try{ for(const o of out){ const res=await withTimeout(S.B.saveRecord(o),8000); if(res==="__timeout") S.offs.set(o.id,o); } return true; }
  catch(e){ toast(e.code==="permission-denied"?t("perm_err"):t("save_fail",{c:e.code||"err"})); return false; }
}
async function undoOff(o){
  try{ const x=Object.assign({},o,{off:false, huyLuc:new Date().toISOString(), huyBoi:S.me.uid}); await withTimeout(S.B.saveRecord(x),8000); S.offs.delete(o.id); toast(t("off_undone")); return true; }

/* Nhập số liệu phiếu giấy đã chép sẵn (PAPER_2026_09) */
async function importPaper(){
  const P=PAPER_2026_09;
  S.impMsg={t:t("imp_working")}; render();
  try{
    if(S.B.mode==="demo") await S.B.clearSample();
    const cat=JSON.parse(JSON.stringify(catalog())); cat.products=cat.products||[]; cat.defects=cat.defects||[];
    P.products.forEach(p=>{ const ex=cat.products.find(x=>x.code.toLowerCase()===p.code.toLowerCase()); if(ex) ex.forms=[...new Set([...(ex.forms||[]),...p.forms])]; else cat.products.push(Object.assign({},p)); });
    P.defects.forEach(d=>{ if(!cat.defects.some(x=>x.id===d.id)) cat.defects.push(Object.assign({},d)); });
    await withTimeout(S.B.setCatalog(Object.assign(cat,{updatedAt:new Date().toISOString(), byUid:S.me.uid})),15000);
    const c=JSON.parse(JSON.stringify(cfg()));
    P.records.forEach(r=>{ const L=c.lines[r.form]=c.lines[r.form]||[]; if(!L.includes(r.line)) L.push(r.line); });
    const sd=P.version+"-01";   // ngày bắt đầu tính tuân thủ = đầu tháng của bộ phiếu
    if(!c.startDate || c.startDate>sd) c.startDate=sd;
    const extra=new Set(c.extraDays||[]); let addedSat=0;
    [...new Set(P.records.map(r=>r.date))].forEach(d=>{ if(!workdayOf(c,d)){ extra.add(d); addedSat++; } });
    c.extraDays=[...extra].sort(); c.holidays=(c.holidays||[]).filter(d=>!extra.has(d));
    /* ngày làm việc trong tháng mà không phiếu nào có số liệu (VD: lễ 2/9) → ghi là ngày nghỉ */
    const has=new Set(P.records.map(r=>r.date)), hol=new Set(c.holidays); let addedHol=0;
    for(let d=parseD(sd); dstr(d)<=lastDay(P.version); d.setDate(d.getDate()+1)){ const ds=dstr(d); if(workdayOf(c,ds) && !has.has(ds)){ hol.add(ds); addedHol++; } }
    c.holidays=[...hol].sort();
    FORM_KEYS.forEach(f=>(c.lines[f]||[]).forEach(l=>{ const k=lineKey(f,l); c.lineArea=c.lineArea||{}; if(!c.lineArea[k]){ const ids=(c.areas||[]).map(a=>a.id), fa=FORMS[f].area; c.lineArea[k]=ids.includes(f)?f:(fa&&ids.includes(fa))?fa:ids[0]; } }));
    await withTimeout(S.B.setConfig(c),15000);
    const list=P.records.filter(r=>{ const ex=S.records.get(r.id); return !(ex && ex.nguon!=="giay"); }).map(r=>Object.assign({},r,{area:areaOfLine(r.form,r.line)}));
    await S.B.saveRecords(list);
    S.impMsg={cls:"ok",t:t("imp_done",{n:list.length,s:P.records.length-list.length,d:addedSat,h:addedHol})};
    S.dash.from=sd.slice(0,7); S.dash.to=todayStr().slice(0,7); S.rep.month=sd.slice(0,7); syncSubs();
  }catch(e){ console.error(e); S.impMsg={cls:"err",t:t("perm_err")+" ("+(e.code||e.message||"")+")"}; }
  render();
}

function csvFor(recs){
  const q=v=>{ const s=String(v==null?"":v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const head=[t("form"),t("line_machine"),t("col_day"),t("col_ca"),t("col_time"),t("col_by"),t("col_res"),...FORMS.kim.items.map(i=>tx(FORMS.kim)+" - "+tx(i)),t("col_code"),...FORMS.caosu.items.map(i=>tx(FORMS.caosu)+" - "+tx(i)),t("col_defect"),t("col_def")+" ("+t("pieces")+")",t("col_l2")+" ("+t("pieces")+")",t("temp"),t("speed"),t("col_mayok"),t("col_note"),t("reported"),t("col_photo"),t("col_src"),"ghiLuc"];
  const rows=recs.map(r=>{ const sp=loiSplit(r); return [tx(FORMS[r.form]),r.line,r.date,caName(r.ca),r.gio,r.nguoi,r.ketqua,
    ...FORMS.kim.items.map(i=>r.form==="kim"?kimCell((r.items||{})[i.k]):""), r.maHang||"",
    ...FORMS.caosu.items.map(i=>r.form==="caosu"?((r.items||{})[i.k]||""):""), loiText(r), sp.tong||"", sp.l2||"", r.nhietDo??"", r.tocDo??"", isMeasure(r.form)?((r.items||{}).mayOK||""):"", r.ghiChu||"", r.ketqua==="NG"?(r.daBao?"x":""):"", (r.photos||[]).length||"", r.nguon==="giay"?t("src_paper"):r.mau?t("src_sample"):t("src_app"), r.ghiLuc||""]; });
  return "﻿"+[head,...rows].map(a=>a.map(q).join(",")).join("\r\n");
}
function saveFile(name, content, type){
  const blob=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast(t("downloaded",{f:name}));
}
function parseHolidays(txt){
  const out=[]; txt.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{ let m;
    if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) out.push(m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]));
    else if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) out.push(m[3]+"-"+pad(+m[2])+"-"+pad(+m[1])); });
  return [...new Set(out)].sort();
}

function applyField(id, value){
  const el=document.getElementById(id); if(el) el.value=value;
  const btn=document.getElementById(id+"-btn"); if(btn){ const sp=btn.querySelector("span"); if(sp) sp.textContent = btn.dataset.kind==="month"?fmtMonthLabel(value):fmtDateLong(value); }
  const d=S.draft;
  if(id==="f-date" && d){ d.date=value; S.overwrite=false; S.saveMsg=null; syncSubs(); render(); }
  else if(id==="f-today"){ S.todayDate=value; syncSubs(); render(); }
  else if(id==="f-month"){ S.rep.month=value; syncSubs(); render(); }
  else if(id==="d-from"){ S.dash.from=value; if(S.dash.to<value) S.dash.to=value; S.dash.sel=null; syncSubs(); render(); }
  else if(id==="c-sat"){ const s=satDraft(cfg()); s.anchor=value; S.cfgSat=s; render(); }
  else if(id==="d-to"){ S.dash.to=value; if(S.dash.from>value) S.dash.from=value; S.dash.sel=null; syncSubs(); render(); }
}

function drawDP(){

  } else {

    let cells=t("dp_wd").map(w=>`<span>${esc(w)}</span>`).join(""); for(let i=0;i<off;i++) cells+=`<span></span>`;
    for(let dd=1; dd<=days; dd++){ const v=P.y+"-"+pad(P.m)+"-"+pad(dd); cells+=`<button type="button" data-act="dp-pick" data-v="${v}" class="${v===P.cur?"sel":""} ${v===todayStr()?"today":""} ${!isWorkday(v)?"off":""}">${dd}</button>`; }
    h=`<div class="dph"><button type="button" data-act="dp-nav" data-v="-1" aria-label="‹">‹</button><span>${esc(t("dp_title",{m:P.m,y:P.y}))}</span><button type="button" data-act="dp-nav" data-v="1" aria-label="›">›</button></div><div class="dpg">${cells}</div><div class="dpf"><button type="button" class="btn ghost sm" data-act="dp-pick" data-v="${todayStr()}">${esc(t("today_btn"))}</button><button type="button" class="btn ghost sm" data-act="dp-close">${esc(t("close"))}</button></div>`;
  }
  el.innerHTML=h; el.hidden=false;
  const btn=document.getElementById(P.id+"-btn"); const r=btn?btn.getBoundingClientRect():{left:16,bottom:80,top:60};
  const w=el.offsetWidth, hh=el.offsetHeight; let left=Math.max(12,Math.min(r.left, window.innerWidth-w-12));
  let top=r.bottom+6; if(top+hh>window.innerHeight-12) top=Math.max(12, r.top-hh-6);
  el.style.left=left+"px"; el.style.top=top+"px";
}

document.addEventListener("mousemove", e=>{ const tp=tipEl(); if(!tp || tp.hidden) return; const w=tp.offsetWidth, h=tp.offsetHeight; let x=e.clientX+14, y=e.clientY+14; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14; tp.style.left=x+"px"; tp.style.top=y+"px"; });

function showRecord(r){

  if(r.form!=="kim") items=F.items.map(it=>{ if(it.type==="num") return `<tr><td>${esc(tx(it))}</td><td class="mono">${esc(r[it.k]??"")}${r[it.k]!=null&&it.unit?" "+esc(it.unit):""}</td><td>${esc((r.lyDo||{})[it.k]||"")}</td></tr>`;

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${r.ketqua==="NG"?"p-ng":"p-ok"}">${esc(r.ketqua)}</span>${capaPill(r)}${isLate(r)?`<span class="pill p-warn">${esc(t("st_late"))}</span>`:""}<span class="sub">${esc(t("col_code"))}: <b>${esc(r.maHang||"—")}</b>${r.ghiLuc?" · "+esc(t("src_app"))+" "+esc(fmtDT(r.ghiLuc)):""}${r.mau?" · "+esc(t("src_sample")):""}</span></div>
    <div class="tablewrap"><table><thead><tr><th>${esc(t("step_items").replace(/^\d+ · /,""))}</th><th>${esc(t("col_res"))}</th><th>${esc(t("reason"))}</th></tr></thead><tbody>${items}</tbody></table></div>
    ${r.loi&&r.loi.tong?`<div><b>${esc(t("col_defect"))}:</b> ${esc(loiText(r))}</div>`:""}
    ${r.ketqua==="NG"?`<div class="sub"><b>${esc(t("cause"))}:</b> ${esc(c.cause||"—")}<br><b>${esc(t("action"))}:</b> ${esc(c.action||"—")}</div>`:""}
    ${(r.photos||[]).length?`<div>${thumbs(r)}</div>`:""}
    ${!isViewer()?`<div class="savebar"><button class="btn ghost sm" data-act="editrec" data-id="${esc(r.id)}">${esc(t("open_old"))}</button></div>`:""}`);
  hydrate();
}

        if(Object.keys(m).length){ await S.B.setAssign({map:m, at:new Date().toISOString(), byUid:S.me.uid}); S.asgDraft=null; }
        toast(t("user_deleted",{n:u?u.name:""})); }catch(x){ toast(t("perm_err")); } return; }
    case "uarea": { const u=S.users.find(x=>x.uid===b.dataset.u); if(!u || !canManageUser(u) || (!isAdmin() && !(myAreas()||[]).includes(b.dataset.v))) return; const cur=(u.areas||[]).slice(); const i=cur.indexOf(b.dataset.v); if(i>=0) cur.splice(i,1); else cur.push(b.dataset.v);
      if(!isAdmin() && !cur.length){ toast(t("need_area")); return; } try{ await S.B.updateUser(u.uid,{areas:cur}); }catch(x){ toast(t("perm_err")); } return; }
    case "nuarea": { const cur=(S.newUserAreas||[]).slice(); const i=cur.indexOf(b.dataset.v); if(i>=0) cur.splice(i,1); else cur.push(b.dataset.v); S.newUserAreas=cur; break; }
    case "addarea": S.cfgAreas=(S.cfgAreas||cfg().areas).map(a=>Object.assign({},a)).concat([{id:"a"+uid8(), name:t("area")+" "+((S.cfgAreas||cfg().areas).length+1)}]); break;
    case "delarea": { const arr=(S.cfgAreas||cfg().areas).map(a=>Object.assign({},a)); arr.splice(+b.dataset.v,1); S.cfgAreas=arr; break; }
    case "rperiod": S.rep.period=b.dataset.v; syncSubs(); break;
    case "rq": S.rep.q=+b.dataset.v; syncSubs(); break;
    case "pform": S.rep.pform=b.dataset.v; break;
    case "csvperiod": { const P=S._period; if(!P) return; const q=v=>{ const s=String(v==null?"":v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
      const rows=[[P.title],[],[t("r_by_month"),t("col_checks"),t("col_compliance"),"NG",t("col_def"),t("col_rate"),t("s_late"),t("s_miss"),t("col_approval")],...P.mRows.map(x=>[fmtMonth(x.m),x.n,x.comp,x.ng,x.def,x.rate,x.late,x.miss,x.ap]),[],[t("r_by_line"),t("area"),t("col_checks"),t("col_compliance"),"NG",t("col_def"),t("col_rate"),t("s_late"),t("s_miss")],...P.lRows.map(x=>[x.o.l+" ("+tx(FORMS[x.o.f])+")",areaName(areaOfLine(x.o.f,x.o.l)),x.n,x.comp,x.ng,x.def,x.rate,x.late,x.miss])];
      const rr=repRange(); saveFile(`baocao_${rr.from}_${rr.to}.csv`, "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n"), "text/csv;charset=utf-8"); return; }
    case "csvperiodraw": { const P=S._period; if(!P) return; const rr=repRange(); saveFile(`kiemtra_${rr.from}_${rr.to}.csv`, csvFor(P.recs.slice().sort((x,y)=>(x.form+x.line+sk(x)).localeCompare(y.form+y.line+sk(y)))), "text/csv;charset=utf-8"); return; }
    case "satmode": { const s=satDraft(cfg()); s.mode=b.dataset.v; if(s.mode==="alt" && !s.anchor){ const d0=parseD(todayStr()); d0.setDate(d0.getDate()+((6-d0.getDay()+7)%7)); s.anchor=dstr(d0); } S.cfgSat=s; break; }
    case "satflip": { const s=satDraft(cfg()); const a=parseD(s.anchor||todayStr()); a.setDate(a.getDate()+7); s.anchor=dstr(a); S.cfgSat=s; break; }
    case "wd": { const v=+b.dataset.v; const cur=(S.cfgWd||cfg().workdays).slice(); const i=cur.indexOf(v); if(i>=0) cur.splice(i,1); else cur.push(v); S.cfgWd=cur; break; }
    case "pm": S.cfgPm=b.dataset.v; break;
    case "savecfg": await saveCfg(); return;
    case "imppaper": openModal(`<h3>${esc(t("imp_q"))}</h3><p class="sub">${esc(t("imp_q_s"))}</p><div class="savebar"><button class="btn primary" data-act="imppaper2">${esc(t("imp_btn",{n:PAPER_2026_09.records.length}))}</button><button class="btn ghost" data-act="closemodal">${esc(t("cancel"))}</button></div>`,true); return;
    case "imppaper2": closeModal(); await importPaper(); return;
    case "copy": { const el=$(b.dataset.v==="fs"?"#rules-fs":"#rules-st"); try{ await navigator.clipboard.writeText(el.textContent); toast("OK"); }catch(x){ const r=document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); } return; }
    case "demoreset": openModal(`<h3>${esc(t("demo_reset_q"))}</h3><div class="savebar"><button class="btn danger" data-act="demoreset2">${esc(t("confirm"))}</button><button class="btn ghost" data-act="closemodal">${esc(t("cancel"))}</button></div>`,true); return;
    case "demoreset2": await S.B.resetAll(); location.reload(); return;
  }
  render();
});
function markDirty(e){ const tg=e.target; if(S.tab==="settings" && tg && tg.id && tg.closest && tg.closest("#view") && !["c-sat","c-hol","c-extra"].includes(tg.id)){ (S.setDirty=S.setDirty||new Set()).add(tg.id); } }
document.addEventListener("input", markDirty, true);
document.addEventListener("change", markDirty, true);
document.addEventListener("input", e=>{
  const tg=e.target, d=S.draft;
  if(S.me && S.me.role==="staff" && workerInput(tg)) return;
  if(tg.classList && tg.classList.contains("tfield")){ let v=tg.value.replace(/\D/g,"").slice(0,4); if(v.length>=3) v=v.slice(0,2)+":"+v.slice(2); if(tg.value!==v) tg.value=v; return; }
  if(tg.id==="c-hol" || tg.id==="c-extra"){ const dy=cfgDays(cfg()); dy[tg.id==="c-hol"?"hol":"extra"]=parseHolidays(tg.value); return; }
  if(tg.dataset && tg.dataset.capa){ S.capaDraft=S.capaDraft||{}; S.capaDraft[tg.dataset.capa]=Object.assign(S.capaDraft[tg.dataset.capa]||{}, {[tg.dataset.f]:tg.value}); return; }
  if(tg.dataset && tg.dataset.cat){ const x=S.catDraft[tg.dataset.cat][+tg.dataset.i]; if(x) x[tg.dataset.f]=tg.value; S.catMsg=null; return; }
  if(["n-code","n-pname","n-dvi","n-dja"].includes(tg.id)){ S.catNew=S.catNew||{pf:[],df:["caosu"]}; S.catNew[tg.id.slice(2)]=tg.value; return; }
  if(tg.id==="u-role"){ S.nu=S.nu||{}; S.nu.role=tg.value; render(); return; }
  if(["u-name","u-user","u-pw"].includes(tg.id)){ S.nu=S.nu||{}; S.nu[tg.id.slice(2)]=tg.value; return; }
  if(tg.id==="f-codeq"){ S.codeQ=tg.value; render(); return; }
  if(tg.dataset && tg.dataset.areaName!=null){ const arr=(S.cfgAreas||cfg().areas).map(x=>Object.assign({},x)); arr[+tg.dataset.areaName].name=tg.value; S.cfgAreas=arr; return; }
  if(!d) return;
  if(tg.id==="f-mahang"){ const was=!!String(d.maHang||"").trim(); d.maHang=tg.value; if(was!==!!tg.value.trim()) render(); }
  else if(tg.id==="f-note") d.ghiChu=tg.value;
  else if(tg.dataset && tg.dataset.reason){ d.lyDo[tg.dataset.reason]=tg.value; }
  else if(tg.dataset && tg.dataset.num){ d[tg.dataset.num]=tg.value;
    const ev=evalDraft(d), rv=$("#res-val"); if(rv){ rv.textContent= ev.missing.length?"—":ev.ketqua; rv.style.color="var(--"+(ev.ketqua==="NG"?"ng":"ok")+")"; } }
  else if(tg.dataset && tg.dataset.defq){ const k=tg.dataset.defq, row=tg.closest(".dq"); const ta=parseInt((row.querySelector("[data-part=ta]")||{}).value,10)||0, doi=parseInt((row.querySelector("[data-part=doi]")||{}).value,10)||0;
    d.loi[k]=Math.max(0,ta*12+doi); const tot=Object.values(d.loi).reduce((s,v)=>s+(+v||0),0), el=$("#def-tot"); if(el) el.textContent=t("defects_title",{n:fmtQty(tot)}); }
});
document.addEventListener("change", e=>{
  const tg=e.target, d=S.draft;
  if(tg.matches("input[data-photo]")){ onPhoto(tg); return; }
  if(tg.matches("select[data-role-of]")){ S.B.updateUser(tg.dataset.roleOf,{role:tg.value}).catch(()=>toast(t("perm_err"))); return; }
  if(tg.id==="f-date" && tg.value){ d.date=tg.value; S.overwrite=false; S.saveMsg=null; syncSubs(); render(); }
  else if(tg.classList.contains("tfield")){ const v=tg.value.length===4&&/^\d{4}$/.test(tg.value)?tg.value.slice(0,2)+":"+tg.value.slice(2):tg.value; if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){ tg.value=v; tg.dataset.prev=v; if(tg.id==="f-gio" && d) d.gio=v; } else { tg.value=tg.dataset.prev||""; toast("HH:MM (00:00–23:59)"); } }
  else if(tg.dataset && (tg.dataset.num || tg.dataset.defq)){ render(); }
  else if(tg.id==="f-year"){ S.rep.y=+tg.value; syncSubs(); render(); }
  else if(tg.matches("select[data-line-area]")){ S.cfgLineArea=Object.assign({},S.cfgLineArea||{}); S.cfgLineArea[tg.dataset.lineArea]=tg.value; }
  else if(tg.id==="f-dabao"){ d.daBao=tg.checked; }
  else if(tg.id==="f-today" && tg.value){ S.todayDate=tg.value; syncSubs(); render(); }
  else if(tg.id==="f-month" && tg.value){ S.rep.month=tg.value; syncSubs(); render(); }
  else if(tg.id==="d-from" && tg.value){ S.dash.from=tg.value; if(S.dash.to<tg.value) S.dash.to=tg.value; syncSubs(); render(); }
  else if(tg.id==="d-to" && tg.value){ S.dash.to=tg.value; if(S.dash.from>tg.value) S.dash.from=tg.value; syncSubs(); render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.dp){ closeDP(); return; } if($("#modal").innerHTML) closeModal(); }
  if(e.key==="Enter" && e.target.matches && e.target.matches("tr[data-act]")) e.target.click();
});
window.addEventListener("online", render); window.addEventListener("offline", render);
setInterval(()=>{ if(S.me && S.tab==="today") render(); }, 60000);

/* ---------- Khởi động ---------- */
(async function boot(){
  const useFb = !!(FIREBASE_CONFIG.apiKey && window.firebase);
  try{ S.B = useFb ? FirebaseBackend() : DemoBackend(); }
  catch(e){ console.error(e); S.B=DemoBackend(); }
  await S.B.init(onAuth);
  if(!S.ready){ S.ready=true; } render();
})();
})();
</script>
</body>
